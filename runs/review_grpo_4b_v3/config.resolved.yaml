name: review_grpo_4b_v3
model: runs/review_sft_4b_v3/final
output_dir: runs/${name}
data:
  task: review
  train_limit: null
  eval_limit: null
  seed: 0
  extra:
    tasks:
    - review/bench/public_tasks.jsonl
    condition: diff+graph
    eval_every: 25
rewards:
- review_gate_v3
reward_weights: null
lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: all-linear
system_prompt: null
enable_thinking: false
grpo:
  num_generations: 16
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  vllm_max_model_length: 16384
  max_completion_length: 500
  temperature: 1.0
  loss_type: dapo
  beta: 0.02
  epsilon: 0.2
  num_iterations: 1
  scale_rewards: group
  learning_rate: 2.0e-05
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  max_steps: 200
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  vllm_importance_sampling_correction: true
  logging_steps: 1
  log_completions: true
  num_completions_to_print: 2
  report_to: none
  save_steps: 50
  save_total_limit: 2
  seed: 0
sft: {}
