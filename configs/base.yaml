# Shared defaults. Every run config `extends: base.yaml` and overrides.
name: base
model: Qwen/Qwen3-1.7B
output_dir: runs/${name}
enable_thinking: false          # Qwen3: no <think> block -> short, learnable completions

lora:
  enabled: false                # full fine-tune by default on the H100; see *_lora.yaml

grpo:
  # --- sampling / group ---
  num_generations: 16           # G completions per prompt (the "group" in GRPO)
  per_device_train_batch_size: 64   # completions per device per micro-step
  gradient_accumulation_steps: 1
  # generation_batch_size defaults to per_device_train_batch_size * num_processes * grad_accum
  vllm_max_model_length: 2048   # prompt + completion window for the colocated vLLM
  max_completion_length: 1024
  temperature: 1.0
  # --- objective ---
  loss_type: dapo               # token-level normalization (TRL's recommended default)
  beta: 0.04                    # KL to the reference; TRL default is 0.0 — we keep it ON to read the term
  epsilon: 0.2                  # PPO-style clip
  num_iterations: 1             # mu: optimizer steps per generation batch
  scale_rewards: group          # advantage = (r - mean_group) / std_group
  # --- optimization ---
  learning_rate: 1.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  max_steps: 300
  # --- vLLM rollouts ---
  use_vllm: true
  vllm_mode: colocate           # vLLM inside the trainer process, same GPU
  vllm_gpu_memory_utilization: 0.35
  vllm_importance_sampling_correction: true
  # --- logging ---
  logging_steps: 1
  log_completions: true
  num_completions_to_print: 2
  report_to: none               # set to wandb and export WANDB_API_KEY on the pod if you want it
  save_steps: 50
  save_total_limit: 2
  seed: 0
