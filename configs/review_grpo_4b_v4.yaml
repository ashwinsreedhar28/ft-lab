# Phase 3b v4 GRPO: thinking on, 2048-token completions, reward v4 (rationale free up to ~1200 tokens, unparsable -3),
# scale_rewards none (v3 lesson), G=16, lr 1e-5, beta 0.02, eval every 25 steps. Phase 0 risk: the policy
# buys reward with tokens -- watch mean_length against the eval curve.
extends: base.yaml
name: review_grpo_4b_v4
model: runs/review_sft_4b_v4/final
enable_thinking: true
lora: {enabled: true, r: 32, alpha: 64, target_modules: all-linear}
data:
  task: review
  extra:
    tasks: [review/bench/public_tasks.jsonl]
    condition: diff+graph
    eval_every: 25
rewards: [review_gate_v4]
grpo:
  learning_rate: 1.0e-5
  num_generations: 16
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  vllm_max_model_length: 16384
  max_completion_length: 2048
  vllm_gpu_memory_utilization: 0.30
  max_steps: 75            # budget: eval every 25 gives 3 points; v3 settled by step 50
  temperature: 1.0
  beta: 0.02
  scale_rewards: none
  save_steps: 50
  save_total_limit: 2
