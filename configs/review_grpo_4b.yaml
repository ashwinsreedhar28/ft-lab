# Phase 3b step 2: GRPO the SFT-warm-started 4B into the triage gate. Train = public_train.jsonl (split field),
# eval = public_eval.jsonl. Reward: ftlab/rewards/review.py (asymmetric, token-priced). No tools: diff + graph only.
extends: base.yaml
name: review_grpo_4b
model: runs/review_sft_4b/final
lora: {enabled: true, r: 32, alpha: 64, target_modules: all-linear}
data:
  task: review
  extra:
    tasks: [review/bench/public_tasks.jsonl]
    condition: diff+graph
rewards: [review_gate]
grpo:
  learning_rate: 1.0e-5
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  vllm_max_model_length: 16384
  max_completion_length: 500
  vllm_gpu_memory_utilization: 0.30
  max_steps: 120
  temperature: 0.9
  beta: 0.04
  save_total_limit: 1
