# Phase 3b step 1: SFT warm-start of Qwen3-4B on Sonnet's harness-v5 decisions (review/analysis/traces.py),
# student sees diff + context graph only. LoRA r=32, merged into runs/review_sft_4b/final.
name: review_sft_4b
model: Qwen/Qwen3-4B
lora: {enabled: true, r: 32, alpha: 64, target_modules: all-linear}
data: {task: review}
sft:
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.05        # transformers 5: warmup_ratio removed; a float here is a ratio
  max_length: 12288
  gradient_checkpointing: true
