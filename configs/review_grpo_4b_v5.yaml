# Phase 3b v5: GRPO straight from the thinking-mode base, no SFT. At T 0.6 the untrained Qwen3-4B with thinking on
# blocks 9/35 bugs and 2/26 clean PRs (P(block|bug) 0.29 vs 0.08) -- the only student start that discriminates;
# every SFT'd student (decision-only v1-v3, rationales v4) blocked both kinds at the same rate or got worse.
# Reward v4 (unparsable -3, rationale free to ~1200 tokens), raw advantages, G=16, lr 1e-5, beta 0.02,
# 75 steps with a T=0.6 eval on the 61 held-out tasks every 25. ~2 h on an H100.
extends: base.yaml
name: review_grpo_4b_v5
model: Qwen/Qwen3-4B
enable_thinking: true
lora: {enabled: true, r: 32, alpha: 64, target_modules: all-linear}
data:
  task: review
  extra:
    tasks: [review/bench/public_tasks.jsonl]
    condition: diff+graph
    eval_every: 25
rewards: [review_gate_v4]
grpo:
  learning_rate: 1.0e-5
  num_generations: 16
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  vllm_max_model_length: 16384
  max_completion_length: 2048
  vllm_gpu_memory_utilization: 0.30
  max_steps: 75
  temperature: 1.0
  beta: 0.02
  scale_rewards: none
  save_steps: 25
  save_total_limit: 2
