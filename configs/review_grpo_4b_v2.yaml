# Phase 3b v2 GRPO. Changes vs review_grpo_4b (v1: 120 steps, lr 1e-5, temp 0.9, beta 0.04 -> kl 0.001, no
# decision shift on the 61-task eval): balanced SFT start, 300 steps, lr 5e-5, temperature 1.0, beta 0.01.
# Bench is v4 (189 tasks after label cleanup: 128 train / 61 eval).
extends: base.yaml
name: review_grpo_4b_v2
model: runs/review_sft_4b_v2/final
lora: {enabled: true, r: 32, alpha: 64, target_modules: all-linear}
data:
  task: review
  extra:
    tasks: [review/bench/public_tasks.jsonl]
    condition: diff+graph
rewards: [review_gate]
grpo:
  learning_rate: 5.0e-5
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  vllm_max_model_length: 16384
  max_completion_length: 500
  vllm_gpu_memory_utilization: 0.30
  max_steps: 300
  temperature: 1.0
  beta: 0.01
  save_steps: 100
  save_total_limit: 1
