# Phase 3: GRPO the review gate. Train rows = mined public-repo PRs; eval = shwin-bench (split by repo).
extends: base.yaml
name: review_8b_lora
model: Qwen/Qwen3-8B
lora: {enabled: true, r: 32, alpha: 64, target_modules: all-linear}
data:
  task: review
  extra:
    tasks: [review/bench/tasks.jsonl, review/mine/tasks.jsonl]
    condition: diff+graph
rewards: [review_gate]
grpo:
  learning_rate: 1.0e-5
  num_generations: 8
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2
  vllm_max_model_length: 16384       # diffs + neighborhood are long
  max_completion_length: 600
  vllm_gpu_memory_utilization: 0.30
  max_steps: 200
  temperature: 0.9
